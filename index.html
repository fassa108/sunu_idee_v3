<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunu-Idees</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>

<!-- NAV -->
<nav>
    <div class="row py-3 px-5 shadow-sm sticky-top text-warning justify-content-between align-items-center">
        <div class="col d-flex justify-content-start">
            <h1>Sunu-Idees</h1>
        </div>
        <div class="col d-flex justify-content-end">
            <span id="compteur" class="btn fw-bold text-warning">0 idée(s)</span>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="container">

    <div class="row py-5 align-items-start">
        <div class="col-md-6">
            <h2 class="mb-4">Bienvenue sur Sunu-Idees</h2>
            <p class="lead">Sunu-Idees est une plateforme dédiée à la collecte et au partage d'idées innovantes.</p>
        </div>

        <div class="col-md-6 d-flex justify-content-end">
            <button class="btn btn-warning mt-3" id="btn-ajouter">
                Soumettre une idée
            </button>
        </div>
    </div>

    <div class="col-lg-8">

        <h2 class="h5 fw-bold mb-3">
            <i class="bi bi-kanban-fill me-2 text-warning"></i>Mur des idées
        </h2>

        <!-- MESSAGE VIDE -->
        <div id="message-vide" class="alert alert-warning text-center">
            <i class="bi bi-lightbulb me-1"></i>
            Aucune idée pour l'instant. Soyez le premier à en soumettre une !
        </div>

        <!-- MUR -->
        <div id="mur" class="row g-3"></div>
    </div>

</main>

<!-- MODAL AJOUT -->
<div class="modal fade" id="modalAjouter" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header bg-warning">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-pencil-square me-2"></i>Ajouter une idée
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <!-- TITRE -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Titre</label>
                    <input type="text" id="ajout-titre" class="form-control" maxlength="80">
                    <small id="erreur-titre" class="text-danger d-none"></small>
                </div>

                <!-- CATEGORIE -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Catégorie</label>
                    <select id="ajout-categorie" class="form-select">
                        <option value="pedagogie">Pédagogie</option>
                        <option value="evenement">Événement</option>
                        <option value="vie_de_campus">Vie de campus</option>
                        <option value="amelioration_technique">Amélioration technique</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <!-- DESCRIPTION -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea id="ajout-description" class="form-control" rows="4" maxlength="400"></textarea>
                    <small id="erreur-description" class="text-danger d-none"></small>
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                <button id="btn-soumettre" class="btn btn-warning fw-bold">
                    <i class="bi bi-save-fill me-1"></i> Ajouter
                </button>
            </div>

        </div>
    </div>
</div>

<!-- MODAL EDIT -->
<div class="modal fade" id="modalEditer" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header bg-warning">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-pencil-square me-2"></i>Modifier l'idée
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Titre</label>
                    <input type="text" id="edit-titre" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Catégorie</label>
                    <select id="edit-categorie" class="form-select">
                        <option value="pedagogie">Pédagogie</option>
                        <option value="evenement">Événement</option>
                        <option value="vie_de_campus">Vie de campus</option>
                        <option value="amelioration_technique">Amélioration technique</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea id="edit-description" class="form-control" rows="4"></textarea>
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                <button id="btn-sauvegarder" class="btn btn-warning fw-bold">
                    <i class="bi bi-save-fill me-1"></i> Sauvegarder
                </button>
            </div>

        </div>
    </div>
</div>

<!-- LOADING -->
<div id="overlay-loading"
     class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center"
     style="background:rgba(0,0,0,0.5); z-index:9999">

    <div class="text-center text-white">
        <div class="spinner-border mb-3"></div>
        <p class="fw-bold">Catégorisation IA en cours...</p>
    </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/index.js"></script>

</body>
</html>
